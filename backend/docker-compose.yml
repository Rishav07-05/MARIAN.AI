services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marian_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/marian_db
      - REDIS_URL=redis://redis:6379/0
      - CLERK_SECRET_KEY=sk_test_mock_clerk_secret_key_for_dev_mode_only
      - CLERK_JWKS_URL=https://api.clerk.com/v1/jwks
      - GOOGLE_CLIENT_ID=mock_google_client_id_for_dev
      - GOOGLE_CLIENT_SECRET=mock_google_client_secret_for_dev
      - GOOGLE_REDIRECT_URI=http://localhost:8000/api/v1/integrations/google/callback
      - TOKEN_ENCRYPTION_KEY=8s9XwM4J7Pq3vR5yZ1N6kL2tF0bH8gD3aE5cI7mO9uY=
      - MARIAN_MODEL_URL=http://localhost:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: marian_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marian_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marian_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
